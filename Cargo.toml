[package]
name = "open-hardware-info"
version = "0.1.0"
edition = "2021"
description = "Monitor de recursos na barra de tarefas do Windows, sem driver próprio"
default-run = "open-hardware-info"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
# Only the settings window uses Slint. The CPU renderer avoids depending on
# OpenGL for a small form with no animation.
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }

[build-dependencies]
slint-build = "1.18"
embed-resource = "3"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
