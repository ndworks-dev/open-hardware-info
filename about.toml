# Licenses accepted for what ships in the binary, used by `cargo about`. A new
# dependency under any other license fails the release build until it is reviewed.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "MPL-2.0",
    "CC0-1.0",
    "OFL-1.1",
    # Slint is triple-licensed and this project uses its royalty-free option.
    # cargo-about can't read that license's text, so the package ships it as
    # LICENSE-Slint.txt; see about.hbs.
    "LicenseRef-Slint-Royalty-free-2.0",
]
